<style>
/* Layout: één kolom op telefoon; op breed scherm raster links, omschrijvingen rechts. MOZA-kaders: zwarte rand, geen ronding, harde schaduw. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --vlak:#1C1C1C; --ink:#F4F2EC; --zacht:#B4B2AA; --rand:#F4F2EC;

  --leeg:#2A2A2A; --hint:#8FA2FF; --schaduw:#FF7AB6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --vlak:#1C1C1C; --ink:#F4F2EC; --zacht:#B4B2AA; --rand:#F4F2EC;
  --cel:#1E1E1E; --woord:#3A3C18; --actief:#8E9420; --vraag:#2B48E8; --vraag-ink:#FFFFFF;
  --leeg:#2A2A2A; --hint:#8FA2FF; --schaduw:#FF7AB6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}

.reeks{font-weight:800;font-size:14px;border:2px solid var(--rand);background:var(--geel);color:#111;padding:6px 10px;box-shadow:3px 3px 0 var(--schaduw)}
.intro{max-width:60ch;color:var(--zacht);margin:0 0 24px}

.knop.geel{background:var(--geel);color:#111}
/* Overzicht */
.niveaus{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:36px}
.niveau{padding:18px;display:flex;flex-direction:column;gap:12px}

.niveau h2{font-size:28px;font-weight:900}

.mini{display:grid;gap:2px;width:72px;border:2px solid var(--rand);background:var(--rand)}

.mini i.z{background:var(--vraag)}

.archief h2{font-size:24px;font-weight:900;margin-bottom:6px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:2px solid var(--rand);background:var(--vlak);font-weight:800;padding:6px 12px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.nummers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.nr{border:2px solid var(--rand);background:var(--vlak);padding:8px 4px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;position:relative}
.nr small{display:block;font-weight:400;font-size:11px;color:var(--zacht)}
.nr.klaar{background:var(--geel);color:#111}
.nr.klaar small{color:#333}
.nr.vandaag{box-shadow:3px 3px 0 var(--roze)}
.nr.bezig small{color:var(--blauw)}

.spelkop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.spelkop .titel{font-weight:900;font-size:20px;flex:1;min-width:0;line-height:1.2}

.tijd{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}

.links{min-width:0;display:flex;flex-direction:column;gap:12px}

.balk .tekst{flex:1;text-align:center;font-weight:800;font-size:17px;padding:6px 4px;line-height:1.25}
.balk .tekst small{display:block;font-weight:400;font-size:12px;opacity:.85}
.raster-houder{position:relative}
.raster{display:grid;grid-template-columns:repeat(var(--n),1fr);border:3px solid var(--rand);background:var(--rand);gap:1px;box-shadow:6px 6px 0 var(--schaduw);user-select:none;-webkit-user-select:none;touch-action:manipulation}

.cel.l.hint{color:var(--hint)}
.cel.l.fout{color:var(--fout);text-decoration:line-through}
.cel.l.mol::after{content:"";position:absolute;top:3px;right:3px;width:max(5px,calc(var(--c)*.12));height:max(5px,calc(var(--c)*.12));background:var(--roze);border-radius:50%}
.cel.v{background:var(--vraag);color:var(--vraag-ink);flex-direction:column;align-items:stretch;justify-content:stretch;font-weight:800;text-transform:none;cursor:pointer}
.cel.leeg{background:var(--leeg);background-image:repeating-linear-gradient(45deg,transparent 0 5px,color-mix(in srgb,var(--roze) 35%,transparent) 5px 7px)}
.cel.hoek{background:#111;color:var(--geel);outline:1px solid var(--rand);font-weight:900;font-size:calc(var(--c)*.22);letter-spacing:.02em}
.vr{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:1px 2px;font-size:clamp(7px,calc(var(--c)*.135),12px);line-height:1.1;position:relative;overflow:hidden;hyphens:auto;word-break:break-word}
.vr+.vr{border-top:1px solid color-mix(in srgb,#fff 45%,transparent)}
.vr.on{background:color-mix(in srgb,var(--geel) 30%,transparent)}
.compact .vr{font-size:calc(var(--c)*.3);font-weight:900}
.pijl{position:absolute;width:0;height:0;border:solid transparent;z-index:2}
.pijl.r{right:0;top:50%;transform:translateY(-50%);border-width:4px 0 4px 6px;border-left-color:var(--geel)}
.pijl.o{bottom:0;left:50%;transform:translateX(-50%);border-width:6px 4px 0 4px;border-top-color:var(--geel)}
.pauze{position:absolute;inset:0;background:var(--bg);border:3px solid var(--rand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}

.legenda{font-size:13px;color:var(--zacht);display:flex;gap:6px;align-items:center}
.legenda i{width:9px;height:9px;border-radius:50%;background:var(--roze);display:inline-block}
.gereedschap{display:flex;gap:8px;flex-wrap:wrap}

.toets{display:none;flex-direction:column;gap:6px;margin-top:4px}
.toets div{display:flex;gap:4px;justify-content:center}
.toets button{flex:1;max-width:44px;height:46px;border:2px solid var(--rand);background:var(--vlak);font-weight:800;font-size:17px;padding:0;box-shadow:2px 2px 0 var(--rand)}
.toets button.wis{max-width:72px;flex:1.6;background:var(--geel);color:#111}
.toets button:active{transform:translate(2px,2px);box-shadow:none}

.lijsten{display:flex;flex-direction:column;gap:16px;min-width:0}
.lijst{padding:12px 0}
.lijst h3{font-size:20px;font-weight:900;padding:0 16px 8px}
.lijst ol{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.lijst li button{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;padding:7px 16px;font-size:15px}

.lijst li button.on{background:var(--blauw);color:#fff}
.lijst li button.af{color:var(--zacht);text-decoration:line-through}

.melding{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 16px;border:2px solid var(--rand);z-index:20;max-width:calc(100% - 32px);text-align:center}

.klaarscherm{position:fixed;inset:0;background:color-mix(in srgb,#111 55%,transparent);display:flex;align-items:center;justify-content:center;z-index:30;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.klaarkaart{max-width:440px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.klaarkaart h2{font-size:30px;font-weight:900;line-height:1.1}

.grote-tijd{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.grote-tijd small{display:block;font-size:14px;font-weight:400;color:var(--zacht);margin-top:4px}
.molbox{border:2px solid var(--rand);background:var(--geel);color:#111;padding:12px 14px}
.molbox b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}

.rij{display:flex;gap:10px;flex-wrap:wrap}
.voorbeeld{font-size:12px;color:var(--zacht);margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style>

.thema{padding:16px;display:flex;flex-direction:column;gap:10px}

.thema .meta{font-size:14px;color:var(--zacht);font-variant-numeric:tabular-nums}
.thema .meta b{color:var(--ink)}

function ontleed(idx){
  const pz=DATA[idx], R=pz.R, C=pz.C;
  const g=Array.from({length:R},()=>Array(C).fill('#'));
  const slots=pz.words.map(w=>{
    const cells=[...w.w].map((ch,k)=>{const r=w.r+(w.d==='V'?k:0), c=w.c+(w.d==='H'?k:0); g[r][c]=ch; return [r,c];});
    return Object.assign({},w,{cells});
  });
  slots.sort((a,b)=>(a.r-b.r)||(a.c-b.c)||(a.d==='H'?-1:1));
  let nr=0; const nrs={};
  slots.forEach((s,k)=>{const key=s.r+','+s.c; if(!nrs[key]) nrs[key]=++nr; s.nr=nrs[key]; s.idx=k;});
  return {idx, id:pz.lv+'-d'+DAG, lv:pz.lv, titel:NIVEAUS.find(n=>n.id===pz.lv).naam, R, C, g:g.map(r=>r.join('')), slots, nrs};
}

function spel(idx){
  P=ontleed(idx);
  const op=S.prog[P.id], klaar=S.done[P.id];

   '<div class="speelveld"><div class="links">'+
   '<div class="balk"><button id="vorige" aria-label="Vorige omschrijving">‹</button><div class="tekst" id="balk"></div><button id="volgende" aria-label="Volgende omschrijving">›</button></div>'+

   '<div class="pauze" id="pauze" hidden><p>Even pauze</p><button class="knop blauw" id="verder">Verder puzzelen</button></div></div></div>'+
   '<div class="weetje" id="weetje" hidden></div>'+
   '<div class="gereedschap"><button class="knop" id="hint">Hint <small>+'+STRAF_HINT+' s</small></button><button class="knop" id="check">Controleer</button><button class="knop" id="wis">Wis woord</button></div>'+
   '<div class="toets" id="toets"></div></div>'+
   '<div class="lijsten"><section class="kader lijst"><h3>Horizontaal</h3><ol id="lijstH"></ol></section><section class="kader lijst"><h3>Verticaal</h3><ol id="lijstV"></ol></section></div></div>';
  bouwRaster(); bouwLijsten(); bouwToetsen();

  document.getElementById('wis').onclick=wisWoord;
  kiesSlot(P.slots.find(s=>s.cells.some(([r,c])=>ST.f[r][c]==='.'))||P.slots[0], true);

function bouwRaster(){
  const el=document.getElementById('raster'); let h='';
  for(let r=0;r<P.R;r++) for(let c=0;c<P.C;c++){
    if(P.g[r][c]==='#'){ h+='<div class="cel x" aria-hidden="true"></div>'; continue; }
    const n=P.nrs[r+','+c];
    h+='<button class="cel l" data-r="'+r+'" data-c="'+c+'" aria-label="Vakje rij '+(r+1)+' kolom '+(c+1)+'">'+(n?'<span class="gnr">'+n+'</span>':'')+'<span class="lt"></span></button>';
  }
  el.innerHTML=h;
  el.addEventListener('click',e=>{
    const b=e.target.closest('.cel.l'); if(!b) return;
    const r=+b.dataset.r, c=+b.dataset.c;
    if(ST.sel&&ST.sel[0]===r&&ST.sel[1]===c){const a=slotVan(r,c,ST.dir==='H'?'V':'H'); if(a) ST.dir=a.d;}
    else { ST.sel=[r,c]; if(!slotVan(r,c,ST.dir)) ST.dir=ST.dir==='H'?'V':'H'; }
    teken();
  });
  new ResizeObserver(()=>P&&el.style.setProperty('--c',(el.clientWidth/P.C)+'px')).observe(el);
}
function bouwLijsten(){
  ['H','V'].forEach(d=>{ document.getElementById('lijst'+d).innerHTML=P.slots.filter(s=>s.d===d).map(s=>'<li><button data-slot="'+s.idx+'"><b>'+s.nr+'</b><span class="inh"></span></button></li>').join(''); });
  document.querySelectorAll('.lijst [data-slot]').forEach(b=>b.onclick=()=>kiesSlot(P.slots[+b.dataset.slot],true));
}
function bouwToetsen(){
  const rijen=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  document.getElementById('toets').innerHTML=rijen.map((r,k)=>'<div>'+r.split('').map(l=>'<button data-k="'+l+'">'+l+'</button>').join('')+(k===2?'<button class="wis" data-k="DEL" aria-label="Wissen">⌫</button>':'')+'</div>').join('');
  document.querySelectorAll('#toets button').forEach(b=>b.onclick=()=>{b.dataset.k==='DEL'?terugToets():typ(b.dataset.k);});
}
function slotVan(r,c,d){return P.slots.find(s=>s.d===d&&s.cells.some(([a,b])=>a===r&&b===c));}
function huidig(){return ST.sel?slotVan(ST.sel[0],ST.sel[1],ST.dir):null;}
function woordGoed(s){return s.cells.every(([r,c])=>ST.f[r][c]===P.g[r][c]);}
function kiesSlot(s,naarLeeg){ST.dir=s.d; const leeg=naarLeeg&&s.cells.find(([r,c])=>ST.f[r][c]==='.'); ST.sel=(leeg||s.cells[0]).slice(); teken();}
function springSlot(st){const s=huidig(); const k=((s?s.idx:-1)+st+P.slots.length)%P.slots.length; kiesSlot(P.slots[k],true);}

function teken(){
  const s=huidig(), inW=new Set(s?s.cells.map(x=>x.join(',')):[]);
  const goed=new Set(); P.slots.forEach(x=>{ if(woordGoed(x)) x.cells.forEach(c=>goed.add(c.join(','))); });
  document.querySelectorAll('#raster .cel.l').forEach(b=>{
    const r=+b.dataset.r, c=+b.dataset.c, k=r+','+c, ch=ST.f[r][c];
    b.querySelector('.lt').textContent=ch==='.'?'':ch;
    b.classList.toggle('woord',inW.has(k));
    b.classList.toggle('act',!!ST.sel&&ST.sel[0]===r&&ST.sel[1]===c);
    b.classList.toggle('hint',ST.h.has(k));
    b.classList.toggle('vast',ST.vast.has(k));
    b.classList.toggle('fout',ST.fout.has(k));
    b.classList.toggle('goed',goed.has(k)&&!ST.h.has(k));
  });
  document.querySelectorAll('.lijst [data-slot]').forEach(b=>{
    const x=P.slots[+b.dataset.slot], ok=woordGoed(x);
    b.classList.toggle('on',!!s&&x.idx===s.idx); b.classList.toggle('af',ok);
    b.querySelector('.inh').innerHTML= ok ? '<span class="om">'+esc(x.clue)+'</span><span class="opl">→ '+esc(x.disp)+'</span><span class="uit">'+esc(x.uitleg)+'</span>' : '<span class="om">'+esc(x.clue)+'</span>';
  });
  if(s){
    document.getElementById('balk').innerHTML=esc(s.clue)+'<small>'+s.nr+' '+(s.d==='H'?'horizontaal':'verticaal')+' · '+s.cells.length+' letters</small>';
    const a=document.querySelector('.lijst [data-slot="'+s.idx+'"]'); if(a&&window.matchMedia('(min-width:861px)').matches) a.scrollIntoView({block:'nearest'});
  }
}
function toonWeetje(s){

function zet(r,c,l){ if(ST.vast.has(r+','+c)) return; ST.f[r][c]=l; ST.fout.delete(r+','+c); if(l==='.') ST.h.delete(r+','+c); }
function nieuwGoed(){
  P.slots.forEach(s=>{ if(!ST.gezien.has(s.idx)&&woordGoed(s)){ ST.gezien.add(s.idx); toonWeetje(s); } });
}
function volgendeCel(s,k){
  for(let j=k+1;j<s.cells.length;j++){const [a,b]=s.cells[j]; if(ST.f[a][b]==='.') return s.cells[j];}
  return null;
}
function typ(l){
  if(ST.klaar||ST.pauze||!ST.sel) return;
  const s=huidig(), [r,c]=ST.sel;
  if(ST.vast.has(r+','+c)){
    if(!s) return;
    const k=s.cells.findIndex(([a,b])=>a===r&&b===c);
    const vrij=s.cells.slice(k+1).find(([a,b])=>!ST.vast.has(a+','+b));
    if(!vrij){ teken(); return; }
    ST.sel=vrij.slice(); return typ(l);
  }
  zet(r,c,l);
  if(s){
    const k=s.cells.findIndex(([a,b])=>a===r&&b===c);
    let v=volgendeCel(s,k);
    if(!v && s.cells[k+1] && s.cells.slice(k+1).some(([a,b])=>!ST.vast.has(a+','+b))) v=s.cells.slice(k+1).find(([a,b])=>!ST.vast.has(a+','+b));
    if(v) ST.sel=v.slice();
    else { const open=P.slots.slice(s.idx+1).concat(P.slots.slice(0,s.idx)).find(x=>x.cells.some(([a,b])=>ST.f[a][b]==='.')); if(open){ nieuwGoed(); kiesSlot(open,true); bewaarV(); kijkKlaar(); return; } }
  }
  nieuwGoed(); teken(); bewaarV(); kijkKlaar();
}
function terugToets(){
  if(ST.klaar||ST.pauze||!ST.sel) return;
  const [r,c]=ST.sel, s=huidig(), k=r+','+c;
  if(ST.f[r][c]!=='.'&&!ST.vast.has(k)) zet(r,c,'.');
  else if(s){ let i=s.cells.findIndex(([a,b])=>a===r&&b===c)-1; while(i>=0&&ST.vast.has(s.cells[i].join(','))) i--; if(i>=0){ST.sel=s.cells[i].slice(); zet(ST.sel[0],ST.sel[1],'.');} }
  teken(); bewaarV();
}
function beweeg(dr,dc){
  if(!ST.sel) return; let [r,c]=ST.sel; const d=dc?'H':'V';
  for(let k=0;k<Math.max(P.R,P.C);k++){ r+=dr; c+=dc; if(r<0||c<0||r>=P.R||c>=P.C) return; if(P.g[r][c]!=='#'){ ST.sel=[r,c]; if(slotVan(r,c,d)) ST.dir=d; else if(!slotVan(r,c,ST.dir)) ST.dir=d==='H'?'V':'H'; teken(); return; } }
}
function hint(){
  if(ST.klaar||ST.pauze||!ST.sel) return;
  const s=huidig(); let doel=ST.sel;
  if(ST.f[doel[0]][doel[1]]===P.g[doel[0]][doel[1]]&&s){ const f=s.cells.find(([a,b])=>ST.f[a][b]!==P.g[a][b]); if(f) doel=f; else { melding('Dit woord klopt al.'); return; } }
  const [r,c]=doel; ST.f[r][c]=P.g[r][c]; ST.h.add(r+','+c); ST.fout.delete(r+','+c); ST.t+=STRAF_HINT;
  ST.sel=[r,c]; toonTijd(); nieuwGoed(); teken(); bewaarV(); kijkKlaar();
}
function controleer(){
  if(ST.klaar) return; ST.fout.clear(); let n=0;
  for(let r=0;r<P.R;r++) for(let c=0;c<P.C;c++){ const v=ST.f[r][c]; if(v!=='#'&&v!=='.'&&v!==P.g[r][c]){ST.fout.add(r+','+c); n++;} }
  teken(); melding(n?(n===1?'1 letter klopt niet.':n+' letters kloppen niet.'):'Alles wat je hebt ingevuld klopt.');
}
function wisWoord(){ if(ST.klaar) return; const s=huidig(); if(!s) return; s.cells.forEach(([r,c])=>{ if(!ST.h.has(r+','+c)) zet(r,c,'.'); }); kiesSlot(s,true); bewaarV(); }
function bewaarV(){ if(!P||ST.klaar) return; S.prog[P.id]={f:ST.f.map(r=>r.join('')),t:ST.t,h:[...ST.h]}; bewaar(); }
function kijkKlaar(){
  if(ST.f.some(r=>r.includes('.'))) return;
  if(!ST.f.every((r,i)=>r.join('')===P.g[i])){ melding('Alles is ingevuld, maar er zit nog een fout in. Tik op Controleer.'); return; }
  ST.klaar=true; stopTimer();
  const t=ST.t, eerder=S.best[P.lv], record=!eerder||t<eerder; if(record) S.best[P.lv]=t;
  S.done[P.id]={t}; delete S.prog[P.id]; bewaar();
  setTimeout(()=>klaarScherm(t,record),400);
}
function klaarScherm(t,record){
  const ander=NIVEAUS.find(n=>n.id!==P.lv), anderKlaar=S.done[ander.id+'-d'+DAG];
  const deel='Ik loste de MOZA Kruiswoordpuzzel ('+P.titel.toLowerCase()+') van vandaag op in '+fmt(t)+'. Hoe snel ben jij? moza.nu/spellen';
  const ov=document.createElement('div'); ov.className='klaarscherm';
  ov.innerHTML='<div class="kader klaarkaart" role="dialog" aria-label="Puzzel opgelost"><h2>Dangke voor <em>het puzzelen!</em></h2>'+
    '<div class="grote-tijd">'+fmt(t)+'<small>'+esc(P.titel)+(record?' · nieuw record':' · record '+fmt(S.best[P.lv]))+(ST.h.size?' · '+ST.h.size+' hint'+(ST.h.size>1?'s':''):'')+'</small></div>'+
    '<div class="molbox"><b>Wist je dat?</b><p>'+esc(P.slots[Math.floor(Math.random()*P.slots.length)].uitleg)+'</p></div>'+
    '<p style="margin:0">Over <em class="aftel">'+tot6()+'</em> staan er nieuwe puzzels klaar. Deel je tijd in de reacties!</p>'+
    '<div class="rij">'+(anderKlaar?'':'<button class="knop blauw" id="ander">Speel ook '+ander.naam.toLowerCase()+'</button>')+'<button class="knop" id="deel">Deel je tijd</button></div>'+
    '<div class="rij"><button class="knop" id="sluit">Lees alle weetjes</button><button class="knop" id="naarOv">Overzicht</button></div></div>';
  document.body.appendChild(ov); startAftel();
  const weg=()=>ov.remove();
  const a=ov.querySelector('#ander'); if(a) a.onclick=()=>{weg(); spel(vanDag(ander.id));};
  ov.querySelector('#sluit').onclick=()=>{weg(); teken(); document.querySelector('.lijsten').scrollIntoView({behavior:'smooth'});};
  ov.querySelector('#naarOv').onclick=()=>{weg(); overzicht();};
  ov.querySelector('#deel').onclick=()=>{ try{navigator.clipboard.writeText(deel).then(()=>melding('Gekopieerd. Plak het waar je wilt.'),()=>melding(deel));}catch(e){melding(deel);} };
  (a||ov.querySelector('#deel')).focus();
}
function toonTijd(){const el=document.getElementById('tijd'); if(el) el.textContent=fmt(ST.t);}
function startTimer(){stopTimer(); timerId=setInterval(()=>{ if(!ST.pauze&&!ST.klaar&&document.visibilityState==='visible'){ST.t++; toonTijd(); if(ST.t%5===0) bewaarV();} },1000);}
function stopTimer(){if(timerId) clearInterval(timerId); timerId=null;}
function zetPauze(a){ if(!P||ST.klaar) return; ST.pauze=a; document.getElementById('pauze').hidden=!a; if(a) bewaarV(); }
document.addEventListener('keydown',e=>{
  if(!P||document.querySelector('.klaarscherm')||e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(/^[a-zA-Z]$/.test(k)){typ(k.toUpperCase()); e.preventDefault();}
  else if(k==='Backspace'){terugToets(); e.preventDefault();}
  else if(k==='ArrowLeft'){beweeg(0,-1); e.preventDefault();}
  else if(k==='ArrowRight'){beweeg(0,1); e.preventDefault();}
  else if(k==='ArrowUp'){beweeg(-1,0); e.preventDefault();}
  else if(k==='ArrowDown'){beweeg(1,0); e.preventDefault();}
  else if(k==='Enter'||k==='Tab'){springSlot(e.shiftKey?-1:1); e.preventDefault();}
});
let mt=null; function melding(t){const m=document.getElementById('melding'); m.textContent=t; m.hidden=false; clearTimeout(mt); mt=setTimeout(()=>m.hidden=true,3200);}
overzicht();
</script>
