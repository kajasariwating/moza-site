name: live.moza.nu bouwen

on:
  schedule:
    - cron: '17 * * * *'   # elk uur
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dorp/**', 'kaarten/atlas-maluku/**', '.github/workflows/dorp.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dorp-pages
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely mapbox-vector-tile pillow
      - name: Gegevens van de vorige keer
        uses: actions/cache/restore@v4
        with:
          path: dorp/.cache
          key: dorp-cache-${{ github.run_id }}
          restore-keys: dorp-cache-
      - name: Bouwen
        run: python3 dorp/bouw.py --uit _site
      - name: Gegevens bewaren
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dorp/.cache
          key: dorp-cache-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
