mzKaart({id:'vulkanen',path:'/kaarten/vulkanen',live:false,
 kicker:'Kaart · Vulkanen',title:'Vulkanen op de Molukken',serif:'vuur onder de eilanden',
 lead:'Op de Molukken liggen veel vulkanen. Sommige zijn al eeuwen stil, andere barsten bijna elk jaar uit. Deze kaart laat zien waar ze liggen en wanneer ze voor het laatst uitbarstten.',

  ['Wat zie je niet?',['Dit is geen waarschuwingssysteem. Het officiële alarmniveau van elke vulkaan vind je bij de Indonesische vulkaandienst <a href="https://magma.esdm.go.id" target="_blank" rel="noopener">MAGMA Indonesia</a>. Meldingen van uitbarstingen zie je ook op de kaart <a href="/kaarten/rampen">Natuurrampen</a>.','Een vulkaan die lang stil is, kan toch weer uitbarsten.']],
  ['Waar komen de gegevens vandaan?',['Van het <a href="https://volcano.si.edu" target="_blank" rel="noopener">Global Volcanism Program</a> van het Smithsonian Institution in de Verenigde Staten. Dat houdt een lijst bij van alle vulkanen op aarde. MOZA heeft de gegevens in november 2026 overgenomen en verandert ze niet.']]],
